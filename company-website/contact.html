<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | NEXORA Technology</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="header">
        <nav class="navbar">

            <a href="index.html" class="logo">
                NEXORA Technology
            </a>

            <button class="menu-toggle" id="menuToggle">
                ☰
            </button>

            <ul class="nav-links" id="navLinks">
                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="about.html">About</a>
                </li>

                <li>
                    <a href="services.html">Services</a>
                </li>

                <li>
                    <a href="contact.html">Contact</a>
                </li>
            </ul>

        </nav>
    </header>
    <main>

    <section class="page-header">

        <p class="small-title">
            Contact Us
        </p>

        <h1>
            Let's Talk
        </h1>

        <p>
            Have a project or requirement?
            Send us a message.
        </p>

    </section>


    <section class="section contact-section">

        <div class="contact-info">

            <h2>
                Get in Touch
            </h2>

            <p>
                We would be happy to discuss your
                project requirements.
            </p>

            <div class="contact-item">
                <strong>Location</strong>
                <span>Sangli, Maharashtra</span>
            </div>

            <div class="contact-item">
                <strong>Email</strong>
                <span>info@nexoratechnology.in</span>
            </div>

            <div class="contact-item">
                <strong>Phone</strong>
                <span>+91 00000 00000</span>
            </div>

        </div>


        <form id="contactForm" class="contact-form">

            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                >

                <small class="error" id="nameError"></small>

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                >

                <small class="error" id="emailError"></small>

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                >

                <small class="error" id="phoneError"></small>

            </div>


            <div class="form-group">

                <label for="message">
                    Message
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    placeholder="Write your message"
                ></textarea>

                <small class="error" id="messageError"></small>

            </div>


            <button type="submit" class="btn primary-btn">
                Send Message
            </button>

            <p id="successMessage" class="success"></p>

        </form>

    </section>

</main>

    <script src="js/script.js"></script>
</body>
</html>
